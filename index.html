<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Cockpit</title>
<meta name="description" content="Private mission control for the IB Diploma Programme.">
<meta name="theme-color" content="#05070A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/sky.css">
<link rel="stylesheet" href="assets/css/cockpit.css">
<link rel="stylesheet" href="assets/css/jet.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try {
    const s = JSON.parse(localStorage.getItem('ibc:settings') || '{}');
    if (s.theme) document.documentElement.dataset.theme = s.theme;
  } catch {}
</script>
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="lamp"></span>IB Cockpit</span>
    <span class="countdown mono" id="countdown">M28</span>
    <span class="topbar-hint mono"><kbd>⌘K</kbd> search anything · <kbd>?</kbd> keys · <kbd>ESC</kbd> closes</span>
  </header>
  <main class="app" id="view"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
